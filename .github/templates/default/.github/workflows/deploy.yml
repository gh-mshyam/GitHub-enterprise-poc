name: Deploy - Infrastructure

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev]  # Adjust based on your needs
      max-parallel: 1

    environment:
      name: ${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets[format('AWS_ROLE_{0}', matrix.environment)] }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        working-directory: infra/default
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: infra/default
        run: |
          terraform plan \
            -var-file="vars-${{ matrix.environment }}.tfvars" \
            -out=tfplan
        continue-on-error: true

      - name: Terraform Apply
        working-directory: infra/default
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          terraform apply -auto-approve -input=false tfplan

      - name: Post Deployment
        if: success()
        run: |
          echo "✅ Deployment to ${{ matrix.environment }} completed"

      - name: Post Failure
        if: failure()
        run: |
          echo "❌ Deployment to ${{ matrix.environment }} failed"
          exit 1

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: deploy
    if: always()

    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ Deployment successful"
          else
            echo "❌ Deployment failed"
          fi
