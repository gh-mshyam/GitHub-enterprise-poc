name: Apply Repository Changes

on:
  push:
    branches: [main]
    paths:
      - infra/repos.tfvars

permissions:
  contents: read
  pull-requests: write
  # TODO: Add id-token: write for AWS OIDC (fetch GitHub token from Secrets Manager)

jobs:
  apply:
    name: Apply Terraform Changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        shell: bash
        # TODO: Add S3 backend configuration when infra/backend.tf is created
        run: |
          cd infra
          terraform init -upgrade=false

      - name: Terraform apply
        shell: bash
        # TODO: Replace secrets.GITHUB_TOKEN with AWS Secrets Manager retrieval (use OIDC role assumption)
        env:
          TF_VAR_github_token: ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        run: |
          cd infra
          terraform apply -auto-approve -var-file=repos.tfvars
          echo "✅ Terraform apply completed"

      - name: Get PR number
        id: pr
        shell: bash
        run: |
          PR_NUMBER=$(gh pr list \
            --state closed \
            --base main \
            --head develop \
            --json number \
            --jq '.[0].number' 2>/dev/null)

          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post success comment
        if: steps.pr.outputs.PR_NUMBER
        shell: bash
        run: |
          PR_NUMBER=${{ steps.pr.outputs.PR_NUMBER }}

          python3 << 'PYTHON_EOF'
          import re
          from pathlib import Path

          tfvars_content = Path("infra/repos.tfvars").read_text()
          repo_ids = re.findall(r'"([^"]+)"\s*=\s*\{', tfvars_content)

          summary = "## ✅ Applied Successfully\n\n"
          summary += f"**Repositories managed:** {len(repo_ids)}\n"

          for repo_id in repo_ids:
            summary += f"- `{repo_id}`\n"

          print(summary)
          Path("success_summary.txt").write_text(summary)
          PYTHON_EOF

          SUMMARY=$(cat success_summary.txt)
          gh pr comment $PR_NUMBER --body "$SUMMARY"
          echo "✅ Success comment posted"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
