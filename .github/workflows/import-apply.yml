name: Apply Repository Import

on:
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - "infra/repositories/imports.tfvars"
      - "infra/repositories/teams.tfvars"

permissions:
  contents: write

jobs:
  import:
    name: Terraform Import
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.title, 'Import:')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Extract Import Targets
        id: targets
        run: |
          # Parse imports.tfvars to find new repositories
          REPOS=$(grep -oP '"\K[^"]+(?="\s*=\s*\{)' infra/repositories/imports.tfvars || true)
          echo "repositories=$REPOS" >> $GITHUB_OUTPUT

          # Parse teams.tfvars for teams
          TEAMS=$(grep -oP '"\K[^"]+(?="\s*=\s*\{)' infra/repositories/teams.tfvars || true)
          echo "teams=$TEAMS" >> $GITHUB_OUTPUT

      - name: Terraform Import Repositories
        working-directory: infra
        env:
          TF_VAR_github_token: ${{ secrets.GH_PROVISIONING_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        run: |
          # Import each repository
          for repo in ${{ steps.targets.outputs.repositories }}; do
            echo "Importing repository: $repo"
            terraform import -input=false \
              "module.repository[\"$repo\"].github_repository.this" \
              "$repo" || echo "Note: Repository may already be imported"
          done

      - name: Terraform Import Teams
        working-directory: infra
        env:
          TF_VAR_github_token: ${{ secrets.GH_PROVISIONING_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        run: |
          # Import each team if any
          for team in ${{ steps.targets.outputs.teams }}; do
            echo "Attempting to import team: $team"
            TEAM_ID=$(gh api orgs/${{ github.repository_owner }}/teams/$team --jq '.id' 2>/dev/null || echo "")
            if [ -n "$TEAM_ID" ]; then
              terraform import -input=false \
                "module.teams[\"$team\"].github_team.this" \
                "$TEAM_ID" || echo "Note: Team may already be imported"
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Plan
        id: plan
        working-directory: infra
        env:
          TF_VAR_github_token: ${{ secrets.GH_PROVISIONING_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        run: |
          terraform plan -input=false -no-color \
            -var-file=repositories/repos.tfvars \
            -var-file=repositories/teams.tfvars \
            -var-file=repositories/imports.tfvars

      - name: Commit State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f infra/terraform.tfstate
          git diff --cached --quiet || git commit -m "Update terraform state after import [skip ci]"
          git push

      - name: Post Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `
## Import Complete

**Repositories imported:** ${{ steps.targets.outputs.repositories }}
**Teams imported:** ${{ steps.targets.outputs.teams || '(none)' }}

### State Updated
- \`infra/terraform.tfstate\` committed
- Repositories now managed by Terraform
- Run \`terraform plan\` to see current state

### Next Steps
1. Verify imported resources appear in GitHub
2. Add team members to \`teams.tfvars\` as needed
3. Configure branch protection if required
            `.trim();

            core.summary.addRaw(summary).write();
