name: Create PR (Develop → Main)

on:
  push:
    branches: [develop]
    paths:
      - infra/repos.tfvars

permissions:
  contents: read
  pull-requests: write
  # TODO: Add id-token: write for AWS OIDC (fetch GitHub token from Secrets Manager)

jobs:
  create-pr:
    name: Create or Update PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if develop is ahead of main
        id: check_diff
        shell: bash
        run: |
          MAIN_SHA=$(git rev-parse origin/main)
          DEVELOP_SHA=$(git rev-parse origin/develop)

          if [ "$MAIN_SHA" != "$DEVELOP_SHA" ]; then
            echo "CHANGES_EXIST=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected between develop and main"
          else
            echo "CHANGES_EXIST=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No changes between branches"
          fi

      - name: Get existing PR
        id: find_pr
        if: steps.check_diff.outputs.CHANGES_EXIST == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh pr list \
            --base main \
            --head develop \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null)

          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "PR_EXISTS=true" >> $GITHUB_OUTPUT
            echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "✅ Found existing PR #$PR_NUMBER"
          else
            echo "PR_EXISTS=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No existing PR found"
          fi

      - name: Create new PR
        if: steps.check_diff.outputs.CHANGES_EXIST == 'true' && steps.find_pr.outputs.PR_EXISTS == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_COUNT=$(grep -c '"[^"]*" = {' infra/repos.tfvars || echo 0)

          cat > /tmp/pr_body.txt <<'BODY'
          ## Sync Repository Configuration

          Repository changes from `develop` branch ready to apply.

          **Repositories managed:** REPO_COUNT_VAR

          ### Next Steps
          - Review changes
          - Approve and merge to main
          - Apply workflow will run automatically

          ---

          **Note:** This PR is auto-generated. Edit title/description as needed.
          BODY

          sed -i.bak "s/REPO_COUNT_VAR/$REPO_COUNT/" /tmp/pr_body.txt

          gh pr create \
            --base main \
            --head develop \
            --title "chore: sync repos.tfvars (develop → main)" \
            --body-file /tmp/pr_body.txt
          echo "✅ PR created"

      - name: Update existing PR
        if: steps.check_diff.outputs.CHANGES_EXIST == 'true' && steps.find_pr.outputs.PR_EXISTS == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ steps.find_pr.outputs.PR_NUMBER }}
          REPO_COUNT=$(grep -c '"[^"]*" = {' infra/repos.tfvars || echo 0)

          cat > /tmp/pr_body.txt <<'BODY'
          ## Sync Repository Configuration

          Repository changes from `develop` branch ready to apply.

          **Repositories managed:** REPO_COUNT_VAR

          ### Next Steps
          - Review changes
          - Approve and merge to main
          - Apply workflow will run automatically

          ---

          **Note:** This PR is auto-generated. Edit title/description as needed.
          BODY

          sed -i.bak "s/REPO_COUNT_VAR/$REPO_COUNT/" /tmp/pr_body.txt

          gh pr edit $PR_NUMBER --body-file /tmp/pr_body.txt
          echo "✅ PR updated (#$PR_NUMBER)"
