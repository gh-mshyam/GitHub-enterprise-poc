name: Create PR

on:
  workflow_dispatch:
    inputs:
      from_branch:
        description: 'Branch to create PR from'
        default: 'develop'
        required: true
        type: string
      to_branch:
        description: 'Branch to create PR to'
        default: 'main'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  # TODO: Add id-token: write for AWS OIDC (fetch GitHub token from Secrets Manager)

jobs:
  create-pr:
    name: Create or Update PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if branches exist
        shell: bash
        env:
          FROM_BRANCH: ${{ inputs.from_branch }}
          TO_BRANCH: ${{ inputs.to_branch }}
        run: |
          git fetch origin
          git rev-parse origin/$FROM_BRANCH || (echo "Branch $FROM_BRANCH not found" && exit 1)
          git rev-parse origin/$TO_BRANCH || (echo "Branch $TO_BRANCH not found" && exit 1)
          echo "Both branches exist"

      - name: Check if changes exist
        id: check_diff
        shell: bash
        env:
          FROM_BRANCH: ${{ inputs.from_branch }}
          TO_BRANCH: ${{ inputs.to_branch }}
        run: |
          FROM_SHA=$(git rev-parse origin/$FROM_BRANCH)
          TO_SHA=$(git rev-parse origin/$TO_BRANCH)

          if [ "$FROM_SHA" != "$TO_SHA" ]; then
            echo "CHANGES_EXIST=true" >> $GITHUB_OUTPUT
          else
            echo "CHANGES_EXIST=false" >> $GITHUB_OUTPUT
          fi

      - name: Get existing PR
        id: find_pr
        if: steps.check_diff.outputs.CHANGES_EXIST == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FROM_BRANCH: ${{ inputs.from_branch }}
          TO_BRANCH: ${{ inputs.to_branch }}
        run: |
          PR_NUMBER=$(gh pr list \
            --base $TO_BRANCH \
            --head $FROM_BRANCH \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null)

          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "PR_EXISTS=true" >> $GITHUB_OUTPUT
            echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_OUTPUT
          else
            echo "PR_EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: Create new PR
        if: steps.check_diff.outputs.CHANGES_EXIST == 'true' && steps.find_pr.outputs.PR_EXISTS == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          FROM_BRANCH: ${{ inputs.from_branch }}
          TO_BRANCH: ${{ inputs.to_branch }}
        run: |
          REPO_COUNT=$(grep -c '"[^"]*" = {' infra/repos.tfvars || echo 0)
          gh pr create --base $TO_BRANCH --head $FROM_BRANCH --title "chore: sync repos.tfvars" --body "Repositories managed: $REPO_COUNT"

      - name: Update existing PR
        if: steps.check_diff.outputs.CHANGES_EXIST == 'true' && steps.find_pr.outputs.PR_EXISTS == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_NUMBER=${{ steps.find_pr.outputs.PR_NUMBER }}
          REPO_COUNT=$(grep -c '"[^"]*" = {' infra/repos.tfvars || echo 0)
          gh pr edit $PR_NUMBER --body "Repositories managed: $REPO_COUNT"
