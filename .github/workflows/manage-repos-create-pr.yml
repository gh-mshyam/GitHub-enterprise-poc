name: Create PR for Repository Changes

on:
  push:
    branches: [develop]
    paths:
      - repositories.json

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Create Pull Request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changes summary
        id: summary
        shell: bash
        run: |
          python3 << 'PYTHON_EOF'
          import json
          from pathlib import Path

          config = json.loads(Path("repositories.json").read_text())
          repos = config.get("repositories", {})

          create_count = len([r for r in repos.values() if r.get("operation") == "create"])
          import_count = len([r for r in repos.values() if r.get("operation") == "import"])
          update_count = len([r for r in repos.values() if r.get("operation") == "update"])
          delete_count = len([r for r in repos.values() if r.get("operation") == "delete"])

          parts = []
          if create_count > 0:
            parts.append(f"create {create_count}")
          if import_count > 0:
            parts.append(f"import {import_count}")
          if update_count > 0:
            parts.append(f"update {update_count}")
          if delete_count > 0:
            parts.append(f"delete {delete_count}")

          summary = ", ".join(parts) if parts else "no changes"
          print(f"SUMMARY={summary}")
          print(f"::set-output name=summary::{summary}")
          PYTHON_EOF

      - name: Create pull request
        run: |
          # Check if PR already exists
          EXISTING_PR=$(gh pr list \
            --base main \
            --head develop \
            --json number \
            --jq '.[0].number' 2>/dev/null)

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "PR #$EXISTING_PR already exists, skipping creation"
          else
            gh pr create \
              --base main \
              --head develop \
              --title "Repository changes: ${{ steps.summary.outputs.summary }}" \
              --body "$(cat .github/pr-template.md 2>/dev/null || echo '## Repository Changes\n\nSee plan in comments.')"
            echo "PR created successfully"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
