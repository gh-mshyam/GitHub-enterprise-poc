name: Template Sync

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

  workflow_dispatch:
    # Manual trigger

  push:
    paths:
      # Auto-trigger when template files change
      - '.github/templates/**'

permissions:
  contents: read
  repository-projects: read

jobs:
  sync:
    name: Sync Templates to Managed Repos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Template Sync
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PROVISIONING_TOKEN }}
          GITHUB_ORG: ${{ github.repository_owner }}
        run: |
          python3 apps/scripts/sync_templates.py

      - name: Summary
        if: always()
        run: |
          echo "## Template Sync Completed" >> $GITHUB_STEP_SUMMARY
          echo "Timestamp: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
