name: Terraform Apply

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform Plan
        working-directory: infra
        env:
          TF_VAR_github_token: ${{ secrets.GH_PROVISIONING_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        run: terraform plan -input=false -no-color -var-file=repositories/repos.tfvars -var-file=repositories/teams.tfvars -var-file=repositories/imports.tfvars

      - name: Terraform Apply
        working-directory: infra
        env:
          TF_VAR_github_token: ${{ secrets.GH_PROVISIONING_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        run: terraform apply -auto-approve -input=false -parallelism=1 -var-file=repositories/repos.tfvars -var-file=repositories/teams.tfvars -var-file=repositories/imports.tfvars -no-color

      - name: Commit State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f infra/terraform.tfstate
          git diff --cached --quiet || git commit -m "Update terraform state after apply [skip ci]"
          git push

      - name: Summary
        run: echo "✅ Terraform Apply Complete"
