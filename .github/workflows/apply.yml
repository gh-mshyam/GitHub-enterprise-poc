name: Terraform Apply

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

jobs:
  detect-type:
    name: Detect Request Type
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    outputs:
      is_import: ${{ steps.detect.outputs.is_import }}

    steps:
      - name: Detect Import vs Normal
        id: detect
        run: |
          if [[ "${{ github.event.pull_request.title }}" =~ ^Import: ]]; then
            echo "is_import=true" >> $GITHUB_OUTPUT
          else
            echo "is_import=false" >> $GITHUB_OUTPUT
          fi

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: detect-type

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Extract Import Targets (Import Only)
        if: needs.detect-type.outputs.is_import == 'true'
        id: targets
        run: |
          REPOS=$(grep -oP '"\K[^"]+(?="\s*=\s*\{)' infra/repositories/imports.tfvars || true)
          echo "repositories=$REPOS" >> $GITHUB_OUTPUT

          TEAMS=$(grep -oP '"\K[^"]+(?="\s*=\s*\{)' infra/repositories/teams.tfvars || true)
          echo "teams=$TEAMS" >> $GITHUB_OUTPUT

      - name: Terraform Import Repositories (Import Only)
        if: needs.detect-type.outputs.is_import == 'true'
        working-directory: infra
        env:
          TF_VAR_github_token: ${{ secrets.GH_PROVISIONING_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        run: |
          for repo in ${{ steps.targets.outputs.repositories }}; do
            echo "Importing repository: $repo"
            terraform import -input=false \
              "module.repository[\"$repo\"].github_repository.this" \
              "$repo" || echo "Note: Repository may already be imported"
          done

      - name: Terraform Import Teams (Import Only)
        if: needs.detect-type.outputs.is_import == 'true'
        working-directory: infra
        env:
          TF_VAR_github_token: ${{ secrets.GH_PROVISIONING_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for team in ${{ steps.targets.outputs.teams }}; do
            echo "Attempting to import team: $team"
            TEAM_ID=$(gh api orgs/${{ github.repository_owner }}/teams/$team --jq '.id' 2>/dev/null || echo "")
            if [ -n "$TEAM_ID" ]; then
              terraform import -input=false \
                "module.teams[\"$team\"].github_team.this" \
                "$TEAM_ID" || echo "Note: Team may already be imported"
            fi
          done

      - name: Terraform Plan
        id: plan
        working-directory: infra
        env:
          TF_VAR_github_token: ${{ secrets.GH_PROVISIONING_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        run: terraform plan -input=false -no-color -var-file=repositories/repos.tfvars -var-file=repositories/teams.tfvars -var-file=repositories/imports.tfvars

      - name: Terraform Apply
        working-directory: infra
        env:
          TF_VAR_github_token: ${{ secrets.GH_PROVISIONING_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        run: terraform apply -auto-approve -input=false -parallelism=1 -var-file=repositories/repos.tfvars -var-file=repositories/teams.tfvars -var-file=repositories/imports.tfvars -no-color

      - name: Commit State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -f infra/terraform.tfstate
          git diff --cached --quiet || git commit -m "Update terraform state after apply [skip ci]"
          git push

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install requests

      - name: Sync Templates to Managed Repos
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PROVISIONING_TOKEN }}
          GITHUB_ORG: ${{ github.repository_owner }}
        run: python3 apps/scripts/sync_templates.py
        continue-on-error: true

      - name: Post Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const isImport = "${{ needs.detect-type.outputs.is_import }}" === 'true';
            const title = isImport ? "✅ Import Complete" : "✅ Apply Complete";
            const message = isImport
              ? `Repositories: ${{ steps.targets.outputs.repositories }}\nTeams: ${{ steps.targets.outputs.teams || '(none)' }}`
              : "Resources created/updated";

            const summary = `
## ${title}

${message}

- State committed
- Resources synchronized
            `.trim();

            core.summary.addRaw(summary).write();
