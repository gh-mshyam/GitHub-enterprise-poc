name: Terraform Apply

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      
      - name: Terraform Init
        run: cd infra && terraform init -input=false
      
      - name: Terraform Apply
        run: cd infra && terraform apply -auto-approve -input=false -parallelism=1 -var="github_token=${{ secrets.GH_PROVISIONING_TOKEN }}" -var="github_owner=${{ github.repository_owner }}" -var-file=repositories/repos.tfvars
        env:
          TF_VAR_github_token: ${{ secrets.GH_PROVISIONING_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
      
      - name: Commit State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f infra/terraform.tfstate ]; then
            git add -f infra/terraform.tfstate
            git diff --cached --quiet || git commit -m "chore: update terraform state [skip ci]"
            git push
          fi

