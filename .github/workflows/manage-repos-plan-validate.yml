name: Plan & Validate Repository Changes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - infra/repos.tfvars
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write
  # TODO: Add id-token: write for AWS OIDC (fetch GitHub token from Secrets Manager)

jobs:
  plan-validate:
    name: Validate and Plan
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '/plan') &&
       github.event.issue.pull_request)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        shell: bash
        # TODO: Add S3 backend configuration when infra/backend.tf is created
        run: |
          cd infra
          terraform init -upgrade=false

      - name: Create terraform plan
        shell: bash
        # TODO: Replace secrets.GITHUB_TOKEN with AWS Secrets Manager retrieval (use OIDC role assumption)
        env:
          TF_VAR_github_token: ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        run: |
          cd infra
          terraform plan -var-file=repos.tfvars -json > tfplan.json 2>&1 || true
          terraform show -json tfplan.json > tfplan_readable.json 2>&1 || true
          echo "✅ Terraform plan completed"

      - name: Build plan summary
        id: plan_summary
        shell: bash
        run: |
          python3 << 'PYTHON_EOF'
          import re
          from pathlib import Path
          from datetime import datetime

          try:
            tfvars_content = Path("infra/repos.tfvars").read_text()
            repo_ids = re.findall(r'"([^"]+)"\s*=\s*\{', tfvars_content)

            summary = "## Terraform Plan Summary\n\n"
            summary += f"**Repositories:** {len(repo_ids)}\n"

            for repo_id in repo_ids:
              summary += f"- `{repo_id}`\n"

            summary += f"\n✅ Plan generated at {datetime.now().isoformat()}"

            print(summary)
            Path("plan_summary.txt").write_text(summary)
          except Exception as e:
            print(f"Error: {e}")
          PYTHON_EOF

      - name: Find or create comment
        id: comment
        shell: bash
        run: |
          PR_NUMBER=${{ github.event.pull_request.number || github.event.issue.number }}

          COMMENT_ID=$(gh pr view $PR_NUMBER \
            --json comments \
            --jq '.comments[] | select(.body | contains("Terraform Plan Summary")) | .id' \
            2>/dev/null | head -1)

          if [ -z "$COMMENT_ID" ]; then
            echo "NEW_COMMENT=true" >> $GITHUB_OUTPUT
          else
            echo "COMMENT_ID=$COMMENT_ID" >> $GITHUB_OUTPUT
            echo "UPDATE_COMMENT=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post plan to PR
        shell: bash
        run: |
          PR_NUMBER=${{ github.event.pull_request.number || github.event.issue.number }}
          PLAN_CONTENT=$(cat plan_summary.txt)

          if [ "${{ steps.comment.outputs.UPDATE_COMMENT }}" == "true" ]; then
            gh pr comment $PR_NUMBER \
              --edit-last \
              --body "$PLAN_CONTENT"
            echo "✅ Comment updated"
          else
            gh pr comment $PR_NUMBER \
              --body "$PLAN_CONTENT"
            echo "✅ Comment created"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
