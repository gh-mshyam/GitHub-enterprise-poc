name: Terraform Plan

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  check-comment:
    name: Check for /plan command
    runs-on: ubuntu-latest
    if: github.event.issue.pull_request && contains(github.event.comment.body, '/plan')
    outputs:
      should_plan: ${{ steps.check.outputs.should_plan }}

    steps:
      - name: Check if /plan command
        id: check
        run: |
          if [[ "${{ github.event.comment.body }}" =~ ^/plan ]]; then
            echo "should_plan=true" >> $GITHUB_OUTPUT
          fi

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: check-comment
    if: needs.check-comment.outputs.should_plan == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        working-directory: infra
        continue-on-error: true
        env:
          TF_VAR_github_token: ${{ secrets.GH_PROVISIONING_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        run: terraform plan -input=false -no-color -var-file=repositories/repos.tfvars -var-file=repositories/teams.tfvars

      - name: Post Plan Comment
        uses: actions/github-script@v7
        with:
          script: |
            const planOutcome = "${{ steps.plan.outcome }}";

            let body;
            if (planOutcome !== 'success') {
              body = "### ❌ Terraform Plan Failed\n\nCheck the workflow logs for details.";
            } else {
              body = "### ✅ Terraform Plan Succeeded\n\nConfiguration is valid. Ready to merge.";
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
