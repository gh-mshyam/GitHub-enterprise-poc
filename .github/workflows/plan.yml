name: Terraform Plan

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - "repositories/**"
      - "apps/scripts/**"
      - ".github/workflows/plan.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        working-directory: infra
        continue-on-error: true
        env:
          TF_VAR_github_token: ${{ secrets.GH_PROVISIONING_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        run: terraform plan -input=false -no-color -var-file=../repositories/example.tfvars -out=tfplan.binary

      - name: Convert Plan To JSON
        if: steps.plan.outcome == 'success'
        working-directory: infra
        run: terraform show -json tfplan.binary > tfplan.json

      - name: Post Plan Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutcome = "${{ steps.plan.outcome }}";

            let body;
            if (planOutcome !== 'success') {
              body = "### Terraform Plan Failed\n\nThe `terraform plan` step did not complete successfully. See the workflow run logs for details.";
            } else if (fs.existsSync('infra/tfplan.json')) {
              body = "### Terraform Plan Succeeded\n\nReview the plan in the workflow logs.";
            } else {
              body = "### Terraform Plan\n\nPlan succeeded.";
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
