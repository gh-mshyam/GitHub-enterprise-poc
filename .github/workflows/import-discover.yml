name: Discover Repository for Import

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: "GitHub repository URL (https://github.com/org/repo or git@github.com:org/repo.git)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    name: Discover Repository
    runs-on: ubuntu-latest

    outputs:
      repo_name: ${{ steps.discover.outputs.repo_name }}
      owner: ${{ steps.discover.outputs.owner }}
      teams_count: ${{ steps.discover.outputs.teams_count }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover Repository
        id: discover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DISCOVERY=$(python3 apps/scripts/discover_repo.py "${{ github.event.inputs.repo_url }}")

          REPO_NAME=$(echo "$DISCOVERY" | jq -r '.repo_name')
          OWNER=$(echo "$DISCOVERY" | jq -r '.owner')
          TEAMS_COUNT=$(echo "$DISCOVERY" | jq -r '.teams_count')
          REPOS_ENTRY=$(echo "$DISCOVERY" | jq -r '.repos_tfvars_entry')
          TEAMS_ENTRIES=$(echo "$DISCOVERY" | jq -r '.teams_tfvars_entries')
          SUMMARY=$(echo "$DISCOVERY" | jq -r '.summary')

          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "teams_count=$TEAMS_COUNT" >> $GITHUB_OUTPUT

          echo "$REPOS_ENTRY" > /tmp/repos_entry.txt
          echo "$TEAMS_ENTRIES" > /tmp/teams_entries.txt
          echo "$SUMMARY" > /tmp/summary.md

      - name: Update imports.tfvars
        run: |
          REPOS_ENTRY=$(cat /tmp/repos_entry.txt)
          TFVARS_FILE="infra/repositories/imports.tfvars"

          if grep -q "\"${{ steps.discover.outputs.repo_name }}\"" "$TFVARS_FILE"; then
            echo "Repository already in imports.tfvars, skipping"
          else
            sed -i '' '/^}$/i\
'"$REPOS_ENTRY"'
' "$TFVARS_FILE"
          fi

      - name: Update teams.tfvars (if teams found)
        if: steps.discover.outputs.teams_count > 0
        run: |
          TEAMS_ENTRIES=$(cat /tmp/teams_entries.txt)
          TFVARS_FILE="infra/repositories/teams.tfvars"

          if [ -n "$TEAMS_ENTRIES" ]; then
            sed -i '' '/^}$/i\
'"$TEAMS_ENTRIES"'
' "$TFVARS_FILE"
          fi

      - name: Validate Configuration
        run: |
          python3 apps/scripts/validate_tfvars.py infra/repositories/imports.tfvars
          if [ -f infra/repositories/teams.tfvars ]; then
            python3 apps/scripts/validate_tfvars.py infra/repositories/teams.tfvars
          fi

      - name: Create Import PR
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="import/${{ steps.discover.outputs.repo_name }}-$(date +%s)"
          SUMMARY=$(cat /tmp/summary.md)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"

          git add infra/repositories/imports.tfvars
          if [ -f infra/repositories/teams.tfvars ]; then
            git add infra/repositories/teams.tfvars
          fi

          git commit -m "Import: Discover ${{ steps.discover.outputs.repo_name }} from ${{ steps.discover.outputs.owner }}"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "Import: ${{ steps.discover.outputs.repo_name }}" \
            --body "$SUMMARY" \
            --base main \
            --head "$BRANCH")

          PR_NUMBER=$(echo "$PR_URL" | grep -oP '/pull/\K[0-9]+')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Post Summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('/tmp/summary.md', 'utf8');

            core.summary
              .addRaw(summary)
              .write();
