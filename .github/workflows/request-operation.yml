name: Request Repository Operation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation to perform"
        required: true
        type: choice
        options:
          - create
          - delete
      repo_name:
        description: "Repository name (lowercase, hyphens only)"
        required: true
        type: string
      visibility:
        description: "Repository visibility (create only)"
        required: false
        type: choice
        options:
          - private
          - internal
      team:
        description: "Team to attach (create only)"
        required: false
        type: string
      description:
        description: "Repository description (create only)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: Validate Input
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.validate.outputs.valid }}
    steps:
      - name: Validate repo_name
        id: validate
        run: |
          REPO_NAME="${{ inputs.repo_name }}"
          if [[ ! $REPO_NAME =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Invalid repository name" >&2
            exit 1
          fi
          if [[ "${{ inputs.operation }}" == "create" ]]; then
            if [[ -z "${{ inputs.visibility }}" ]]; then
              echo "For create operation, visibility is required" >&2
              exit 1
            fi
          fi
          echo "valid=true" >> $GITHUB_OUTPUT

  modify:
    name: Modify Configuration and Create PR
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      pr_number: ${{ steps.create_pr.outputs.pr_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Modify repos.tfvars
        env:
          OPERATION: ${{ inputs.operation }}
          REPO_NAME: ${{ inputs.repo_name }}
          VISIBILITY: ${{ inputs.visibility }}
          DESCRIPTION: ${{ inputs.description }}
        run: python3 apps/scripts/modify_tfvars.py

      - name: Create PR
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="ops/${{ inputs.operation }}-${{ inputs.repo_name }}-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add repositories/repos.tfvars
          git commit -m "[${{ inputs.operation }}] Repository: ${{ inputs.repo_name }}"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "[${{ inputs.operation }}] ${{ inputs.repo_name }}" \
            --body "Operation: ${{ inputs.operation }}\nRepository: ${{ inputs.repo_name }}\nVisibility: ${{ inputs.visibility }}" \
            --base main --head "$BRANCH")

          PR_NUMBER=$(echo "$PR_URL" | grep -oP '/pull/\K[0-9]+')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

  apply-and-merge:
    name: Terraform Plan and Merge
    runs-on: ubuntu-latest
    needs: modify
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        working-directory: infra
        continue-on-error: true
        env:
          TF_VAR_github_token: ${{ secrets.GH_PROVISIONING_TOKEN }}
          TF_VAR_github_owner: ${{ github.repository_owner }}
        run: terraform plan -input=false -no-color -var-file=../repositories/repos.tfvars -out=tfplan.binary

      - name: Convert Plan to JSON
        if: steps.plan.outcome == 'success'
        working-directory: infra
        run: terraform show -json tfplan.binary > tfplan.json

      - name: Post Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr_number = ${{ needs.modify.outputs.pr_number }};
            const planOutcome = "${{ steps.plan.outcome }}";

            let body;
            if (planOutcome !== 'success') {
              body = "### Terraform Plan Failed\n\nSee workflow logs for details.";
            } else {
              body = "### Terraform Plan\n\nPlan succeeded. Review the logs for details.";
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr_number,
              body,
            });
